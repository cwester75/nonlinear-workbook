name: Numerical validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        source: [head, v0.2.0]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ matrix.source == 'head' && github.sha || matrix.source }}
      - if: runner.os != 'Windows'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Install checksum-pinned CPython 3.12.14 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'cpython-3.12.14.tar.gz'
          $runtime = Join-Path $env:RUNNER_TEMP 'cpython-3.12.14'
          Invoke-WebRequest -Uri 'https://github.com/astral-sh/python-build-standalone/releases/download/20260929/cpython-3.12.14%2B20260929-x86_64-pc-windows-msvc-install_only.tar.gz' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '28728baf30b65e263f0b25c5a85be8226e7ab0d212fbadd6a8f0f796139fa804') { throw 'Python archive checksum mismatch' }
          New-Item -ItemType Directory -Path $runtime | Out-Null
          tar -xzf $archive -C $runtime
          if ($LASTEXITCODE -ne 0) { throw 'Python extraction failed' }
          (Join-Path $runtime 'python') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $runtime 'python/Scripts') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: python -c "import platform; assert platform.python_version() == '3.12.14'"
      - run: python -m pip install -r requirements-release.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m unittest discover -s tests -v
      - run: python examples/release_smoke.py
      - run: python examples/chapter09/validation.py
      - run: python examples/chapter10/validation.py
      - run: python examples/chapter13/validation.py --smoke
